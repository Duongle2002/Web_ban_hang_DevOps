services:
  web:
    image: ${IMAGE_NAME:-web_ban_hang}:${IMAGE_TAG:-latest}
    container_name: web_ban_hang
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', res => { if (res.statusCode >= 200 && res.statusCode < 500) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes: []